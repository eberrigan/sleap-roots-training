name: CI

on:
  push:
    branches: [ "main" ]  # Run on push to main branch only
  pull_request:
    types: [opened, synchronize]  # Run when PR is opened or updated
    branches: [ "main" ]  # Run on PRs to main branch

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    
    
    - name: Install system dependencies for SLEAP
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev libssl-dev libffi-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sleap[pypi]==1.4.1
        pip install -e .[dev]
    
    - name: Run linting
      run: |
        black --check --diff sleap_roots_training/ tests/
    
    - name: Run tests with coverage
      run: |
        pytest --cov=sleap_roots_training --cov-report=xml --cov-report=html --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Check coverage threshold
      run: |
        # Extract coverage percentage from coverage.xml
        coverage_percent=$(python -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('coverage.xml')
        root = tree.getroot()
        coverage = root.attrib['line-rate']
        print(f'{float(coverage) * 100:.1f}')
        ")
        echo "Coverage: ${coverage_percent}%"
        
        # Check if coverage meets threshold (80%)
        if (( $(echo "$coverage_percent >= 80" | bc -l) )); then
          echo "✅ Coverage threshold met: ${coverage_percent}%"
        else
          echo "❌ Coverage threshold not met: ${coverage_percent}% (minimum: 80%)"
          exit 1
        fi

  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist/