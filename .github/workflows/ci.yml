name: CI

on:
  push:
    branches: [ "**" ]  # Run on all branches
  pull_request:
    branches: [ "**" ]  # Run on PRs to any branch

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies for SLEAP
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev libssl-dev libffi-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install SLEAP via PyPI
        pip install sleap[pypi]==1.4.1
        # Then install our package with dev dependencies
        pip install -e .[dev]
    
    - name: Run linting
      run: |
        black --check sleap_roots_training/ tests/
    
    - name: Run tests with coverage
      run: |
        pytest --cov=sleap_roots_training --cov-report=xml --cov-report=html --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload coverage reports as artifact
      uses: actions/upload-artifact@v4
      if: matrix.python-version == '3.9'
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/
    
    - name: Check coverage threshold
      run: |
        # Extract coverage percentage from coverage.xml
        coverage_percent=$(python -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('coverage.xml')
        root = tree.getroot()
        coverage = root.attrib['line-rate']
        print(f'{float(coverage) * 100:.1f}')
        ")
        echo "Coverage: ${coverage_percent}%"
        
        # Check if coverage meets threshold (80%)
        if (( $(echo "$coverage_percent >= 80" | bc -l) )); then
          echo "✅ Coverage threshold met: ${coverage_percent}%"
        else
          echo "❌ Coverage threshold not met: ${coverage_percent}% (minimum: 80%)"
          exit 1
        fi

  test-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Test imports
      run: |
        python -c "
        import sleap_roots_training
        import sleap_roots_training.config
        import sleap_roots_training.train
        import sleap_roots_training.evaluate
        import sleap_roots_training.models
        import sleap_roots_training.datasets
        print('✅ All imports successful!')
        "

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black
    
    - name: Run black formatter check
      run: |
        black --check --diff sleap_roots_training/ tests/
    
    - name: Run black formatter (show what would be changed)
      if: failure()
      run: |
        echo "The following files would be reformatted:"
        black --check --diff sleap_roots_training/ tests/ || true
        echo ""
        echo "To fix formatting issues, run: black sleap_roots_training/ tests/"

  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: 3.9
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist/

  coverage-report:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download coverage reports
      uses: actions/download-artifact@v4
      with:
        name: coverage-reports
    
    - name: Coverage Comment
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        COMMENT_FILENAME: coverage.xml
        MINIMUM_GREEN: 80
        MINIMUM_ORANGE: 60