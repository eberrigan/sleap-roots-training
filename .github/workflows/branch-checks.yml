name: Branch Checks

on:
  push:
    branches: [ "**" ]
    paths:
      - 'sleap_roots_training/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'sleap_roots_training/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    
    - name: Install minimal dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black pytest pyyaml pandas numpy matplotlib seaborn wandb
        # Install SLEAP via PyPI for basic testing
        pip install sleap[pypi]==1.4.1
        pip install -e .
    
    - name: Check code formatting
      run: |
        black --check --diff sleap_roots_training/ tests/
    
    - name: Test imports
      run: |
        python -c "
        import sleap_roots_training
        import sleap_roots_training.config
        import sleap_roots_training.train
        import sleap_roots_training.evaluate
        import sleap_roots_training.models
        import sleap_roots_training.datasets
        print('[OK] All imports successful')
        "
    
    - name: Run basic tests
      run: |
        pytest tests/test_imports.py tests/test_config.py -v
    
    - name: Validate package structure
      run: |
        python -c "
        import sleap_roots_training
        assert hasattr(sleap_roots_training, '__version__')
        assert sleap_roots_training.__version__ == '0.0.1a0'
        print(f'[OK] Package version: {sleap_roots_training.__version__}')
        
        # Check that all expected modules are accessible
        modules = ['config', 'train', 'evaluate', 'models', 'datasets']
        for module in modules:
            assert hasattr(sleap_roots_training, module)
            print(f'[OK] Module {module} accessible')
        
        print('[SUCCESS] Package structure validated')
        "

  compatibility-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.10"]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install and test imports
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml pandas numpy matplotlib seaborn wandb
        pip install sleap[pypi]==1.4.1
        pip install -e .
        python -c "
        import sleap_roots_training
        from sleap_roots_training.config import load_config
        config = load_config()
        print(f'[OK] Cross-platform test passed on {\'${{ matrix.os }}\'} Python {\'${{ matrix.python-version }}\'}')
        "