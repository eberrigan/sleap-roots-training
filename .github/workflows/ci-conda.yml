name: CI with Conda

on:
  push:
    branches: [ "**" ]  # Run on all branches
  pull_request:
    branches: [ "**" ]  # Run on PRs to any branch

jobs:
  test-conda:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        python-version: ${{ matrix.python-version }}
        channels: conda-forge,defaults
        channel-priority: strict
        activate-environment: sleap-test
        use-mamba: true
    
    - name: Install SLEAP and dependencies
      shell: bash -l {0}
      run: |
        # Install SLEAP with proper channels for each platform
        if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          conda install -c conda-forge -c anaconda -c sleap sleap=1.4.1
        else
          conda install -c conda-forge -c nvidia -c sleap/label/dev -c sleap -c anaconda sleap=1.4.1
        fi
        # Install our package with dev dependencies
        pip install -e .[dev]
    
    - name: Test imports
      shell: bash -l {0}
      run: |
        python -c "
        import sleap_roots_training
        import sleap_roots_training.config
        import sleap_roots_training.train
        import sleap_roots_training.evaluate
        import sleap_roots_training.models
        import sleap_roots_training.datasets
        import sleap
        import wandb
        print('[OK] All imports successful!')
        "
    
    - name: Run tests
      shell: bash -l {0}
      run: |
        # Run tests that don't require external services
        pytest tests/test_imports.py tests/test_config.py -v
    
    - name: Run linting
      shell: bash -l {0}
      run: |
        black --check sleap_roots_training/ tests/
    
    - name: Test configuration
      shell: bash -l {0}
      run: |
        python -c "
        from sleap_roots_training.config import load_config, DEFAULT_CONFIG
        config = load_config()
        print('[OK] Configuration loaded successfully')
        print(f'Project name: {config.get(\"project_name\", \"Not set\")}')
        print(f'Default config keys: {list(DEFAULT_CONFIG.keys())}')
        "

  test-mocked:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
    
    - name: Install dependencies without SLEAP
      run: |
        python -m pip install --upgrade pip
        # Install SLEAP via PyPI for mocked tests
        pip install sleap[pypi]==1.4.1
        # Install our package with dev dependencies
        pip install -e .[dev]
    
    - name: Run mocked tests
      run: |
        # Run tests that use mocking for external dependencies
        pytest tests/test_config.py tests/test_imports.py -v --cov=sleap_roots_training --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false